name: BloFin 15m scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 15m market scan
        run: python market_scan_15m.py > scan.md

      - name: Post result to GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "3"
        run: gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file scan.md
