name: BloFin 15m scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 15m market scan
        run: python market_scan_15m.py > scan.md

      - name: Build notification
        run: |
          {
            echo "@Photofiver"
            echo
            cat scan.md
          } > notification.md

      - name: Post result to main scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "3"
        run: gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file notification.md

      - name: Create assigned alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +"%H:%M UTC")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "BloFin 15m alert - $NOW" \
            --body-file notification.md \
            --assignee "Photofiver"
