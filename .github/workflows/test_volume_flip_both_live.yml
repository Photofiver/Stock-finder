name: LIVE both-sided volume flip offline unit tests NO ORDERS
on:
  push:
    paths:
      - 'blofin_volume_flip_both_live.py'
      - 'test_volume_flip_both_live.py'
      - 'test_volume_flip_exit_429_recovery.py'
      - 'test_volume_candle_audit.py'
      - 'test_price_movement_audit.py'
      - 'blofin_live_hourly.py'
      - '.github/workflows/test_volume_flip_both_live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            blofin_volume_flip_both_live.py
            test_volume_flip_both_live.py
            test_volume_flip_exit_429_recovery.py
            test_volume_candle_audit.py
            test_price_movement_audit.py
            blofin_live_hourly.py
            blofin_selection_rank.py
            blofin_nearest_volume.py
            test_reverse_short_long_live.py
            blofin_reverse_short_long_live.py
            blofin_trade_charts.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only HTTP dependency
        run: python -m pip install requests==2.32.3
      - name: Test LONG SHORT signal exits and mocked orders (no real funds)
        env:
          BLOFIN_LIVE_ENABLED: 'false'
          LIVE_VOLUME_FLIP_BOTH_PAUSE_ENTRIES: 'true'
        run: python -m unittest -v test_volume_flip_both_live test_volume_flip_exit_429_recovery test_volume_candle_audit test_price_movement_audit
