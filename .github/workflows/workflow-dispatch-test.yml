name: Watchdog timing test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflow-dispatch-test.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog-live-trigger-v2
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Run aligned 15m heartbeat loop and trigger LIVE bot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 23); do
            NOW=$(date +%s)
            PERIOD=900
            OFFSET=60
            TARGET=$(( ((NOW - OFFSET) / PERIOD + 1) * PERIOD + OFFSET ))
            WAIT=$(( TARGET - NOW ))
            echo "Heartbeat $i/23: waiting ${WAIT}s for next :01/:16/:31/:46 UTC slot"
            sleep "$WAIT"
            echo "WATCHDOG_OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Triggering blofin_live_signal_watch.yml"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/blofin_live_signal_watch.yml/dispatches" \
              -d '{"ref":"main"}'
          done

      - name: Start next watchdog run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/workflow-dispatch-test.yml/dispatches" \
            -d '{"ref":"main"}'
