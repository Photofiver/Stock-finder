name: Watchdog timing test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflow-dispatch-test.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog-live-trigger-v2
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Run aligned 5m heartbeat loop and trigger LIVE bot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 23); do
            NOW=$(date +%s)
            PERIOD=300
            OFFSET=2
            TARGET=$(( ((NOW - OFFSET) / PERIOD + 1) * PERIOD + OFFSET ))
            WAIT=$(( TARGET - NOW ))
            echo "Heartbeat $i/23: waiting ${WAIT}s for next 5m close +2s UTC slot"
            sleep "$WAIT"
            echo "WATCHDOG_OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Triggering blofin_live_signal_watch.yml"
            if ! curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/blofin_live_signal_watch.yml/dispatches" \
              -d '{"ref":"main"}'; then
              echo "::warning::LIVE dispatch failed after retries; continuing watchdog loop"
            fi
            # Independent 07:00 UK report fallback using the existing watchdog.
            UK_HM=$(TZ=Europe/London date +%H:%M)
            case "$UK_HM" in
              07:00|07:05|07:10|07:15|07:20|07:25)
                echo "Triggering 07:00 UK daily report fallback at $UK_HM"
                gh workflow run blofin_daily_ntfy_report.yml --ref main || echo "::warning::Report dispatch retry on next heartbeat"
                ;;
            esac
          done

      - name: Start next watchdog run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/workflow-dispatch-test.yml/dispatches" \
            -d '{"ref":"main"}'
