name: BloFin read-only audit tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_live_scan_audit.py'
      - 'blofin_nearest_volume.py'
      - 'blofin_live_hourly.py'
      - 'blofin_live_signal_watch.py'
      - 'tests/test_blofin_nearest_live.py'
      - 'tests/test_blofin_audit_touch.py'
      - '.github/workflows/blofin_audit_quality.yml'

permissions:
  contents: read

jobs:
  audit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile nearest-volume LIVE and audit modules (no orders)
        run: python -m py_compile blofin_live_hourly.py blofin_live_signal_watch.py blofin_nearest_volume.py blofin_live_scan_audit.py tests/test_blofin_nearest_live.py tests/test_blofin_audit_touch.py
      - name: Test nearest-volume selection and audit without exchange access
        run: python -m unittest discover -s tests -p 'test_blofin_*.py' -v
