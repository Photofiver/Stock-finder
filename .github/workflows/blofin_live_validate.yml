name: BloFin LIVE validate

on:
  push:
    paths:
      - 'blofin_live_hourly.py'
      - '.github/workflows/blofin_live_validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate LIVE bot syntax only
        run: python -m py_compile blofin_live_hourly.py
