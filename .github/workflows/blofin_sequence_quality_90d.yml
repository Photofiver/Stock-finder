name: BloFin 90d candle-pattern quality filter study (READ ONLY)
on:
  push:
    branches:
      - research/sequence-quality-90d-20261023
    paths:
      - '.github/workflows/blofin_sequence_quality_90d.yml'
      - 'research/sequence_quality_90d/test_sequences.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: blofin-sequence-quality-90d
  cancel-in-progress: false

jobs:
  offline-filter-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - name: Checkout frozen replay candidates and offline test script
        uses: actions/checkout@v4
        with:
          ref: research/sequence-quality-90d-20261023
          fetch-depth: 0
          sparse-checkout: |
            research/capital_replay_20261023/candidate_parts
            research/sequence_quality_90d
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read already downloaded 90-day OHLCV archive without redownloading candles
        uses: actions/download-artifact@v4
        with:
          run-id: 39994070142
          repository: Photofiver/Stock-finder
          github-token: ${{ github.token }}
          pattern: blofin-free-90d-shard-*
          path: /tmp/blofin-original-90d
          merge-multiple: true
      - name: Run entry-pattern selection with frozen holdout
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/sequence_quality_90d/test_sequences.py
          python research/sequence_quality_90d/test_sequences.py /tmp/blofin-original-90d
      - name: Upload complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blofin-90d-sequence-quality-results
          path: |
            research/sequence_quality_90d/result.json
            research/sequence_quality_90d/README.md
          if-no-files-found: warn
          retention-days: 90
      - name: Publish final report on research branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sequence_quality_90d/result.json research/sequence_quality_90d/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store validated candle pattern quality analysis [skip ci]'
          git push origin HEAD:research/sequence-quality-90d-20261023
