name: BloFin Diagnose Stochastic Clean Losses

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_diagnose_stoch_clean_losses.py'
      - '.github/workflows/blofin_diagnose_stoch_clean_losses.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_diagnose_stoch_clean_losses.py
