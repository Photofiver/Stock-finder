name: TOP200 Every-Day Net-Positive Setup (READ ONLY)

on:
  push:
    paths:
      - 'blofin_top200_daily_positive_setup_readonly.py'
      - '.github/workflows/blofin_top200_daily_positive_setup_readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public data dependency
        run: python -m pip install requests==2.32.3
      - name: Load cached 390-coin candle history from completed GitHub Actions
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Syntax check
        run: python -m py_compile blofin_top200_daily_positive_setup_readonly.py
      - name: Check EVERY one of eight UK days for profitable recurring setup
        env:
          RESEARCH_ASOF_UK: '2026-10-17'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_daily_positive_setup_readonly.py
      - name: Preserve reproducible daily profits report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top200-daily-positive-8days
          path: blofin_top200_daily_positive_setup_report.json
          retention-days: 14
          if-no-files-found: ignore
