name: BloFin RSI Armed 1m Same Data

on:
  push:
    paths:
      - 'blofin_backtest_rsi_armed_1m_same_data.py'
      - '.github/workflows/blofin_backtest_rsi_armed_1m_same_data.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_rsi_armed_1m_same_data.py
