name: Read-only 5m JSON volume price tunnel replay
on:
  push:
    paths:
      - 'research_volume_price_tunnel_saved_json_readonly.py'
      - '.github/workflows/research_volume_price_tunnel_saved_json_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            blofin_volume_flip_both_live.py
            blofin_live_state.json
            research_volume_price_tunnel_saved_json_readonly.py
            blofin_live_scans/live_watch_history_5m_part0025.json
            blofin_live_scans/live_watch_history_5m_part0026.json
            blofin_live_scans/live_watch_history_5m_part0027.json
            blofin_live_scans/live_watch_history_5m_part0028.json
            blofin_live_scans/live_watch_history_5m_part0029.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare recorded BloFin JSON trades to volume price tunnel (read-only, no orders)
        env:
          BLOFIN_LIVE_ENABLED: 'false'
          LIVE_VOLUME_FLIP_BOTH_PAUSE_ENTRIES: 'true'
        run: python -u research_volume_price_tunnel_saved_json_readonly.py
