name: BloFin LIVE check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-live-approval
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Refresh pending signal
        run: |
          sleep 8
          git pull --ff-only origin main

      - name: Approve LIVE signal
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_MAX_BANKROLL_USDT: '10.6136'
        run: python blofin_live_approve.py

      - name: Save LIVE approval state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f blofin_pending_signal.json ]; then
            git add blofin_pending_signal.json
          fi
          if [ -f blofin_live_state.json ]; then
            git add blofin_live_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin live approval state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
