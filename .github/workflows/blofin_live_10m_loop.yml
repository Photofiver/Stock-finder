name: BloFin LIVE 4H scan

on:
  push:
    paths:
      - 'live10_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-live-4h-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align to next UK 4H close
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/London")
          now = datetime.now(tz)
          next_hour = ((now.hour // 4) + 1) * 4
          if next_hour >= 24:
              target = (now + timedelta(days=1)).replace(hour=0, minute=0, second=2, microsecond=0)
          else:
              target = now.replace(hour=next_hour, minute=0, second=2, microsecond=0)

          wait = (target - datetime.now(tz)).total_seconds()
          if 0 < wait <= 600:
              print(f"Waiting {wait:.1f}s for UK 4H close at {target.isoformat()}")
              time.sleep(wait)
          else:
              print("Trigger not in pre-close window; running immediately")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run one 4H LIVE scan
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_MAX_BANKROLL_USDT: '10.64'
          LIVE_SIGNAL_MINUTES: '240'
          LIVE_SIGNAL_MAX_AGE_MS: '14400000'
        run: python blofin_live_signal_watch.py

      - name: Save 4H LIVE state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blofin_signal_state.json 2>/dev/null || true
          git add blofin_pending_signal.json 2>/dev/null || true
          git add blofin_live_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin 4H LIVE state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Notify LIVE 4H failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin LIVE 4H ERROR' \
            -H 'Priority: 5' \
            -d "LIVE 4H scan failed. Sprawdz GitHub Actions run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
