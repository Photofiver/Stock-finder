name: BloFin LIVE 15m scan

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  push:
    paths:
      - 'live15_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-live-15m-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run one 15m LIVE scan
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_MAX_BANKROLL_USDT: '10.64'
          LIVE_SIGNAL_MINUTES: '15'
          LIVE_SIGNAL_MAX_AGE_MS: '840000'
        run: python blofin_live_signal_watch.py

      - name: Save 15m LIVE state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blofin_signal_state.json 2>/dev/null || true
          git add blofin_pending_signal.json 2>/dev/null || true
          git add blofin_live_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin 15m LIVE state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Notify LIVE 15m failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin LIVE 15m ERROR' \
            -H 'Priority: 5' \
            -d "LIVE 15m scan failed. Sprawdz GitHub Actions run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
