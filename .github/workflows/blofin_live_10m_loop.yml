name: BloFin LIVE trader

on:
  workflow_dispatch:
  repository_dispatch:
    types: [blofin-quarter-hour]
  schedule:
    - cron: "13,28,43,58 * * * *"

concurrency:
  group: blofin-live-trader
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile blofin_alert_15m.py blofin_live_trader.py blofin_scan_analytics.py

      - name: Align trigger to candle close +2s
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: |
          python - <<'PY'
          import datetime
          import time

          now = time.time()
          dt = datetime.datetime.now(datetime.timezone.utc)
          hour_start = dt.replace(minute=0, second=0, microsecond=0).timestamp()
          # Always align to the next 15-minute candle close plus 2 seconds.
          quarter = 15 * 60
          target = ((int(now) // quarter) + 1) * quarter + 2
          delay = target - time.time()

          print(f"TIMING_PROBE_NOW_UTC={datetime.datetime.now(datetime.timezone.utc).isoformat()}")
          print(f"TIMING_PROBE_TARGET_UTC={datetime.datetime.fromtimestamp(target, datetime.timezone.utc).isoformat()}")
          print(f"TIMING_PROBE_WAIT_SECONDS={max(0.0, delay):.3f}")

          if delay > 0:
              time.sleep(delay)

          actual = time.time()
          print(f"TIMING_PROBE_START_UTC={datetime.datetime.fromtimestamp(actual, datetime.timezone.utc).isoformat()}")
          print(f"TIMING_PROBE_START_AFTER_TARGET_MS={int((actual - target) * 1000)}")
          PY

      - name: Run BloFin timing probe
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: python blofin_live_trader.py --dry-run

      - name: Update scan analytics
        continue-on-error: true
        run: python blofin_scan_analytics.py

      - name: Persist rolled capital and trade logs
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f blofin_bot_state.json ]; then
            git add blofin_bot_state.json
          fi

          if [ -d blofin_live_trades ]; then
            git add blofin_live_trades
          fi

          if [ -d blofin_live_scans ]; then
            git add blofin_live_scans
          fi

          if [ -d blofin_live_scan_summary ]; then
            git add blofin_live_scan_summary
          fi

          if git diff --cached --quiet; then
            echo "No live state changes to persist"
            exit 0
          fi

          git commit -m "Persist BloFin live state and trade log [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
# schedule refresh
