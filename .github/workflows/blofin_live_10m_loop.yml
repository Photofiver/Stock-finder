name: BloFin LIVE 15m scheduled

on:
  workflow_dispatch:
  push:
    paths:
      - 'live15_trigger.txt'
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: blofin-live-15m-continuous
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Wait for intended 15m candle close and run one LIVE scan
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_MAX_BANKROLL_USDT: '10.64'
          LIVE_SIGNAL_MINUTES: '15'
          LIVE_SIGNAL_MAX_AGE_MS: '840000'
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -u

          persist_state() {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add blofin_signal_state.json 2>/dev/null || true
            git add blofin_pending_signal.json 2>/dev/null || true
            git add blofin_live_state.json 2>/dev/null || true
            git add blofin_live_technical_events.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'Update BloFin 15m LIVE state [skip ci]' || true
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            fi
          }

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            WAIT="$(python - <<'PY'
          import time
          from datetime import datetime, timedelta, timezone

          now_ts = time.time()
          now = datetime.fromtimestamp(now_ts, timezone.utc)
          slots = (12, 27, 42, 57)
          candidates = []
          for hour_shift in (0, -1):
              base = now + timedelta(hours=hour_shift)
              for minute in slots:
                  occurrence = base.replace(minute=minute, second=0, microsecond=0)
                  if occurrence.timestamp() <= now_ts:
                      candidates.append(occurrence)
          occurrence = max(candidates)
          target = occurrence + timedelta(minutes=3, seconds=2)
          wait = max(0, int(target.timestamp() - now_ts))
          print(wait)
          PY
            )"

            if [ "${WAIT}" -gt 0 ]; then
              echo "Started early; waiting ${WAIT}s for intended 15m candle close."
              sleep "${WAIT}"
            else
              echo "Scheduled job started after intended candle close; scanning immediately."
            fi
          else
            echo "Manual run: scanning immediately."
          fi

          echo "LIVE 15m scan at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if ! python blofin_live_signal_watch.py; then
            curl -fsS --retry 2 --max-time 20 \
              -H 'Title: BloFin LIVE 15m ERROR' \
              -H 'Priority: 5' \
              -d "LIVE 15m scan failed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." \
              'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
          fi

          persist_state
