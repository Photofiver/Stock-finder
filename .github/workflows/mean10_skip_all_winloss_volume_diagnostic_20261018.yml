name: Read only mean10 below average win loss diagnostic
on:
  push:
    paths:
      - 'mean10_skip_all_winloss_volume_diagnostic_20261018.py'
      - '.github/workflows/mean10_skip_all_winloss_volume_diagnostic_20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            volume_rule_mean10_hour_20261018_readonly.py
            mean10_skip_all_winloss_volume_diagnostic_20261018.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39146799601
          github-token: ${{ github.token }}
          pattern: mean10-hour-shard-*
          merge-multiple: true
          path: shards
      - name: Diagnose winning and losing signal volumes, skip above mean10
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u mean10_skip_all_winloss_volume_diagnostic_20261018.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mean10-below-average-winners-losers-20261018
          path: mean10_skip_all_winloss_volume_diagnostic_20261018.json
          retention-days: 7
          if-no-files-found: ignore
