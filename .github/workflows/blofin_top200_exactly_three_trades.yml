name: TOP200 Exactly Three Daily Entries (READ ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_top200_exactly_three_trades.py'
      - '.github/workflows/blofin_top200_exactly_three_trades.yml'

permissions:
  contents: read
  actions: read

jobs:
  calculate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests==2.32.3
      - name: Reuse historical 390 instrument candle batches
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Code validation
        run: python -m py_compile blofin_top200_exactly_three_trades.py
      - name: Run causal three-per-day backtest on historical TOP200
        env:
          RESEARCH_ASOF_UK: '2026-10-17'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_exactly_three_trades.py
      - name: Upload exact three trades per day research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top200-exactly-three-entries-report
          path: blofin_top200_exactly_three_trades_report.json
          if-no-files-found: ignore
          retention-days: 14
