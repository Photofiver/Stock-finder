name: BloFin 1H Scanner

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

concurrency:
  group: blofin-hourly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python blofin_scanner.py
