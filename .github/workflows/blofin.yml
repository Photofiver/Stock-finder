name: BloFin 1H Scanner

on:
  push:
    paths:
      - 'trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-hourly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python blofin_scanner.py

      - name: Save market cap baseline
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- marketcap_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketcap_state.json
            git commit -m "Update hourly market cap baseline"
            git push
          else
            echo "No market cap baseline update needed"
          fi
