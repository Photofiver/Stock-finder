name: BloFin 1H Scanner

on:
  push:
    paths:
      - 'trigger.txt'
  schedule:
    - cron: '6 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Align external trigger to minute 01
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          MIN=$(date -u +%M)
          SEC=$(date -u +%S)
          MIN=$((10#$MIN))
          SEC=$((10#$SEC))
          WAIT=0

          # Normal pre-triggers arrive near xx:50/55/58 and wait for the next xx:01.
          if [ "$MIN" -ge 50 ]; then
            WAIT=$((((61 - MIN) * 60) - SEC))
          elif [ "$MIN" -eq 0 ]; then
            WAIT=$((60 - SEC))
          fi

          # If an external trigger itself was delayed past xx:01, recover immediately
          # instead of waiting another hour.
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 900 ]; then
            echo "External trigger received at minute ${MIN}; waiting ${WAIT}s for xx:01"
            sleep "$WAIT"
          else
            echo "Running immediately at minute ${MIN}"
          fi

      - name: Refresh repository state
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python blofin_scanner.py

      - name: Save scanner state
        if: success()
        shell: bash
        run: |
          if [ ! -f scanner_state.json ]; then
            echo "No scanner state to save"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_state.json

          if git diff --cached --quiet; then
            echo "No scanner state change"
            exit 0
          fi

          git commit -m "Update scanner state"
          git pull --rebase origin main
          git push

      - name: Notify workflow failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin 1H Scanner' \
            -H 'Priority: 4' \
            -d "BŁĄD workflow GitHub Actions. Sprawdź run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
