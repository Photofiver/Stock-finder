name: BloFin 1H Scanner

on:
  push:
    paths:
      - '_pipeline_test.txt'
  schedule:
    - cron: '59 * * * *'
    - cron: '1 * * * *'
    - cron: '6 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofin-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Align early run to minute 01
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          MIN=$(date -u +%M)
          SEC=$(date -u +%S)
          MIN=$((10#$MIN))
          SEC=$((10#$SEC))
          WAIT=0

          if [ "$MIN" -eq 59 ]; then
            WAIT=$((120 - SEC))
          elif [ "$MIN" -eq 0 ]; then
            WAIT=$((60 - SEC))
          fi

          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 180 ]; then
            echo "Waiting ${WAIT}s for xx:01"
            sleep "$WAIT"
          fi

      - name: Refresh repository state
        if: github.event_name != 'push'
        shell: bash
        run: git pull --ff-only

      - name: Random-time pipeline smoke test
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TEST_LABEL=$(cat _pipeline_test.txt)
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "TEST_START $TEST_LABEL $STARTED"

          BLOFIN_JSON=$(curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            'https://openapi.blofin.com/api/v1/market/tickers')
          python -c 'import json,sys; p=json.load(sys.stdin); assert str(p.get("code"))=="0" and isinstance(p.get("data"),list) and p["data"], "bad BloFin response"' <<< "$BLOFIN_JSON"
          echo "BLOFIN_OK"

          NTFY_JSON=$(curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin pipeline test' \
            -H 'Priority: 4' \
            -d "TEST $TEST_LABEL | GitHub->BloFin->ntfy OK | $STARTED" \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n')
          python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("id"), "ntfy missing id"; print("NTFY_OK", p["id"])' <<< "$NTFY_JSON"
          echo "TEST_END $TEST_LABEL $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Run scanner
        if: github.event_name != 'push'
        run: python blofin_scanner.py

      - name: Save scanner state
        if: success() && github.event_name != 'push'
        shell: bash
        run: |
          if [ ! -f scanner_state.json ]; then
            echo "No scanner state to save"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_state.json

          if git diff --cached --quiet; then
            echo "No scanner state change"
            exit 0
          fi

          git commit -m "Update scanner state"
          git pull --rebase origin main
          git push
