name: Volume Hold Until Reversal Research (READ ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_volume_hold_until_reversal_readonly.py'
      - '.github/workflows/blofin_volume_hold_until_reversal_readonly.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout root-only source and read-only state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests==2.32.3
      - name: Static check
        run: python -m py_compile blofin_volume_hold_until_reversal_readonly.py blofin_volume_meaningful_profit_8day.py blofin_volume_peak_trend_backtest_readonly.py
      - name: Evaluate volume holding with publicly available exchange candles only
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_volume_hold_until_reversal_readonly.py
      - name: Upload research JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-hold-until-reversal-report
          path: volume_hold_until_reversal_report.json
          retention-days: 7
          if-no-files-found: ignore
