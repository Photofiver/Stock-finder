name: Long breakout analysis
on:
  push:
    branches:
      - analysis-long-breakout-20261002
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python analyze_long_breakout_once.py
