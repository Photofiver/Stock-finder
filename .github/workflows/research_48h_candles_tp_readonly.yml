name: TOP200 last 48h candle shapes versus TP read-only

on:
  push:
    paths:
      - 'research_48h_candles_tp_readonly.py'
      - '.github/workflows/research_48h_candles_tp_readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Verified October 9-17 market history for full TOP200 ranking
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: history
      - name: Verified up to 00:50 UK 390 coin history
        uses: actions/download-artifact@v4
        with:
          run-id: 39080889854
          github-token: ${{ github.token }}
          pattern: early-hour-shard-*
          merge-multiple: true
          path: older
      - name: Verified 02:55 UK 390 coin extension
        uses: actions/download-artifact@v4
        with:
          run-id: 39088649866
          github-token: ${{ github.token }}
          pattern: rsi12-refresh-*
          merge-multiple: true
          path: recent
      - name: Reuse verified full 390-coin latest public candle extension from previous scan
        uses: actions/download-artifact@v4
        with:
          run-id: 39094370484
          github-token: ${{ github.token }}
          pattern: 48h-candle-final-*
          merge-multiple: true
          path: fresh
      - name: Compare 48h TOP200 candle patterns with TP-before-SL outcomes
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_48h_candles_tp_readonly.py analyze
      - name: Save full candlestick report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top200-candle-pattern-tp-48h-20261018
          path: blofin_48h_candle_tp_patterns.json
          retention-days: 10
          if-no-files-found: ignore
