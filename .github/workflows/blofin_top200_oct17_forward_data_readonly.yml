name: TOP200 New Completed Day Data for Forward Check READ ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blofin_top200_oct17_forward_data_readonly.yml'

permissions:
  contents: read

jobs:
  get_market_history:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTTP client
        run: python -m pip install requests==2.32.3
      - name: Download latest 8 completed UK days ending 18 October 2026
        env:
          RESEARCH_ASOF_UK: '2026-10-18'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_parallel_runner.py fetch ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: top200-forward-17oct-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json.gz
          retention-days: 3
          if-no-files-found: error
