name: Audit saved BloFin JSON for SHORT 20/0 rule READ ONLY
on:
  push:
    paths:
      - 'research_saved_json_short20_audit_readonly.py'
      - '.github/workflows/research_saved_json_short20_audit_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research_saved_json_short20_audit_readonly.py
            blofin_live_state.json
            blofin_learning_12h.json
            blofin_pattern_learning.json
            blofin_pending_signal.json
            strategy_watch_history.jsonl
            blofin_live_scans/live_watch_history_5m_part0029.json
            blofin_live_scans/live_watch_history.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit saved JSON schemas only; do not trade
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_saved_json_short20_audit_readonly.py
