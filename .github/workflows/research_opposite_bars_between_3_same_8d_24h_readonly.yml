name: Count OPPOSITE candle streaks causing losses 3 same bars 8d 24h READ ONLY
on:
  push:
    paths:
      - 'research_opposite_bars_between_3_same_8d_24h_readonly.py'
      - '.github/workflows/research_opposite_bars_between_3_same_8d_24h_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research_opposite_bars_between_3_same_8d_24h_readonly.py
            research_three_same_colour_exit_top200_24h_readonly.py
            research_three_same_colour_exit_top200_8d_readonly.py
            research_volume_bar_counts_top200_20261018_readonly.py
            research_compare_flip24_early_same_top200_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Restore archived 24h 5m data
        uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Restore archived 8d 5m data
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Compare losing trades and counterfactual exits at 1-5 opposing bars, no fees
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_opposite_bars_between_3_same_8d_24h_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opposing-candle-loss-buckets-and-stop-variations
          path: opposite_bars_between_3_same_profit_loss_8d_24h.json
          retention-days: 14
          if-no-files-found: ignore
