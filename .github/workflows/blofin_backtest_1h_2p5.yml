name: BloFin 1H 2.5x Median Backtest

on:
  push:
    paths:
      - 'blofin_backtest_1h_2p5.py'
      - '.github/workflows/blofin_backtest_1h_2p5.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_1h_2p5.py
