name: BloFin 5m Test

on:
  push:
    paths:
      - 'test5m.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 5m test
        env:
          TIMEFRAME: 5m
          FORCE_SCAN: '1'
          NO_STATE: '1'
        run: python blofin_scanner.py
