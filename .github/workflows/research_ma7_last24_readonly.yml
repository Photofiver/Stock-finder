name: MA7 last 24h LONG SHORT read-only
on:
  push:
    paths:
      - 'research_ma7_last24_readonly.py'
      - '.github/workflows/research_ma7_last24_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research_ma7_last24_readonly.py
            blofin_live_state.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - run: python -u research_ma7_last24_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: ma7-last24-results
          path: ma7_last24_results.json
          retention-days: 10
