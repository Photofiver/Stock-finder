name: BloFin LIVE signal watch

on:
  workflow_dispatch:
  schedule:
    - cron: '1-56/5 * * * *'

permissions:
  contents: write

concurrency:
  group: blofin-live-signal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Scan for LIVE signal
        run: python blofin_live_signal_watch.py

      - name: Save signal state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blofin_signal_state.json blofin_pending_signal.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin signal state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
