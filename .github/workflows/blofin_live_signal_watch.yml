name: BloFin LIVE signal watch

on:
  workflow_dispatch:
  schedule:
    # Pre-warm the GitHub runner before each 5m candle closes.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: blofin-live-signal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository state
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Align prepared scheduler to 5m candle close
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          MIN=$(date -u +%M)
          SEC=$(date -u +%S)
          MIN=$((10#$MIN))
          SEC=$((10#$SEC))
          REM=$((MIN % 5))
          WAIT=0

          # Scheduled at :03/:08/... to prepare checkout and Python before close.
          # Run at the next 5m boundary +2s when ready early. If GitHub
          # starts late, run immediately and keep candle/quote freshness gates.
          if [ "$REM" -eq 3 ] || [ "$REM" -eq 4 ]; then
            WAIT=$(((5 - REM) * 60 - SEC + 2))
          elif [ "$REM" -eq 0 ] && [ "$SEC" -lt 2 ]; then
            WAIT=$((2 - SEC))
          fi

          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting ${WAIT}s for 5m candle close"
            sleep "$WAIT"
          else
            echo "Scheduled run started after boundary; checking immediately"
          fi

      - name: Scan 5m LIVE signal and execute AUTO after revalidation
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_SIGNAL_MINUTES: '5'
          LIVE_UNIVERSE_TOP_N: '100'
          LIVE_ENTRY_TOP_N: '100'
          LIVE_MA_CROSS: 'true'
          LIVE_SIGNAL_MAX_AGE_MS: '180000'
          LIVE_MAX_BANKROLL_USDT: '20.00'
          LIVE_ENTRY_STRATEGY: 'NEAREST_VOLUME'
        run: python blofin_live_signal_watch.py

      - name: Save signal and LIVE state
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Read-only diagnostics run AFTER LIVE execution, never before placing orders.
          # A diagnostics/API failure must never block saving LIVE state.
          if [ -f blofin_live_state.json ]; then
            LIVE_SIGNAL_MINUTES=5 python blofin_live_scan_audit.py || echo 'AUDIT_ERROR: scan diagnostics failed; preserving LIVE state'
            for audit_file in blofin_live_scans/live_watch_history_5m_part*.json; do
              if [ -f "$audit_file" ]; then
                git add -- "$audit_file"
              fi
            done
          fi
          git add blofin_signal_state.json
          if [ -f blofin_pending_signal.json ]; then
            git add blofin_pending_signal.json
          fi
          if [ -f blofin_live_state.json ]; then
            git add blofin_live_state.json
          fi
          if [ -f blofin_live_technical_events.json ]; then
            git add blofin_live_technical_events.json
          fi
          if [ -f blofin_learning_12h.json ]; then
            git add blofin_learning_12h.json
          fi
          if [ -f blofin_pattern_learning.json ]; then
            git add blofin_pattern_learning.json
          fi
          # Preserve indicator-rich entry and exit PNGs so they can be viewed by hour.
          if [ -d blofin_trade_charts ]; then
            git add -- blofin_trade_charts/
          fi
          # Archive full 20-level BID/ASK snapshots for accepted/rejected entries.
          if [ -d blofin_order_books ]; then
            git add -- blofin_order_books/
          fi
          # Durable, secret-free bot memory: generate only AFTER execution and
          # diagnostics; never block risk controls or trading if cache fails.
          python bot_context_builder.py || echo 'BOT_CONTEXT_UPDATE_ERROR: memory refresh failed'
          if [ -f bot_context.json ]; then
            git add -- bot_context.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin signal state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Notify LIVE scanner failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin LIVE scanner ERROR' \
            -H 'Priority: 5' \
            -d "LIVE scanner failed. Sprawdz GitHub Actions run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
