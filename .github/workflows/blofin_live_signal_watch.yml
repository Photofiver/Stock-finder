name: BloFin LIVE signal watch

on:
  workflow_dispatch:
  schedule:
    # Pre-warm the GitHub runner before each 5m candle closes.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: blofin-live-signal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Start with code, current state and append-only order-book logs.
          # Large scan/chart archives are only needed after LIVE execution.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /blofin_order_books/
            /blofin_fast_scan_events/
          sparse-checkout-cone-mode: false

      - name: Refresh repository state
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Align prepared scheduler to 5m candle close
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          MIN=$(date -u +%M)
          SEC=$(date -u +%S)
          MIN=$((10#$MIN))
          SEC=$((10#$SEC))
          REM=$((MIN % 5))
          WAIT=0

          # Scheduled at :03/:08/... to prepare checkout and Python before close.
          # Run at the next 5m boundary +2s when ready early. If GitHub
          # starts late, run immediately and keep candle/quote freshness gates.
          if [ "$REM" -eq 3 ] || [ "$REM" -eq 4 ]; then
            WAIT=$(((5 - REM) * 60 - SEC + 2))
          elif [ "$REM" -eq 0 ] && [ "$SEC" -lt 2 ]; then
            WAIT=$((2 - SEC))
          fi

          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting ${WAIT}s for 5m candle close"
            sleep "$WAIT"
          else
            echo "Scheduled run started after boundary; checking immediately"
          fi

      - name: Scan 5m LIVE signal and execute AUTO after revalidation
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_SIGNAL_MINUTES: '5'
          LIVE_UNIVERSE_TOP_N: '200'
          LIVE_ENTRY_TOP_N: '100'
          LIVE_MA_CROSS: 'false'
          LIVE_RED_SMA_REBOUND: 'true'
          LIVE_CANDLE_CONFIRM_WORKERS: '16'
          LIVE_SIGNAL_MAX_AGE_MS: '180000'
          LIVE_MAX_BANKROLL_USDT: '25.00'
          LIVE_MAX_DRAWDOWN_PCT: '0.10'
          BLOFIN_MAX_ENTRY_SPREAD_PCT: '0.10'
          BLOFIN_MAX_ADVERSE_ENTRY_GAP_PCT: '0.10'
          LIVE_ENTRY_STRATEGY: 'RED_SMA_REBOUND'
        run: python blofin_live_signal_watch.py

      - name: Save signal and LIVE state
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the LIVE critical path limited to small trading-state files.
          # Historical 5m audit is handled by the separate postscan workflow.
          git add blofin_signal_state.json
          if [ -f blofin_pending_signal.json ]; then
            git add blofin_pending_signal.json
          fi
          if [ -f blofin_live_state.json ]; then
            git add blofin_live_state.json
            # Store a small chronological scan log; expensive charts and
            # historical analysis remain in a separate audit workflow.
            python blofin_fast_scan_events_writer.py || echo 'FAST_SCAN_LOG_WARN'
            if [ -d blofin_fast_scan_events ]; then
              git add -- blofin_fast_scan_events/
            fi
          fi
          if [ -f blofin_live_technical_events.json ]; then
            git add blofin_live_technical_events.json
          fi
          if [ -f blofin_learning_12h.json ]; then
            git add blofin_learning_12h.json
          fi
          if [ -f blofin_pattern_learning.json ]; then
            git add blofin_pattern_learning.json
          fi
          # Preserve indicator-rich entry and exit PNGs so they can be viewed by hour.
          if [ -d blofin_trade_charts ]; then
            git add --sparse --ignore-removal -- blofin_trade_charts/
          fi
          # Archive full 20-level BID/ASK snapshots for accepted/rejected entries.
          if [ -d blofin_order_books ]; then
            git add -- blofin_order_books/
          fi
          # Compact context refresh is delegated to asynchronous audit runner.
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin signal state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Notify LIVE scanner failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin LIVE scanner ERROR' \
            -H 'Priority: 5' \
            -d "LIVE scanner failed. Sprawdz GitHub Actions run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
