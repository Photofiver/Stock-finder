name: BloFin LIVE signal watch

on:
  workflow_dispatch:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'

permissions:
  contents: write

concurrency:
  group: blofin-live-signal-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align pre-trigger to the 10m candle close
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          MIN=$(date -u +%M)
          SEC=$(date -u +%S)
          MIN=$((10#$MIN))
          SEC=$((10#$SEC))
          REM=$((MIN % 10))
          WAIT=0

          # Align early external triggers to the next 10m close.
          # If a trigger arrives up to 1m59s after a close, run immediately
          # and process that just-closed candle instead of skipping to the next one.
          if [ "$REM" -eq 0 ]; then
            if [ "$SEC" -lt 2 ]; then
              WAIT=$((2 - SEC))
            fi
          elif [ "$REM" -eq 1 ]; then
            WAIT=0
          else
            WAIT=$((((10 - REM) * 60) - SEC + 2))
          fi

          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 605 ]; then
            echo "Pre-trigger received at ${MIN}:${SEC}; waiting ${WAIT}s for confirmed 10m close"
            sleep "$WAIT"
          else
            echo "Running immediately at minute ${MIN}, second ${SEC}"
          fi
      - name: Refresh repository state
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Scan 10m LIVE signal and execute AUTO after revalidation
        env:
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          BLOFIN_LIVE_ENABLED: 'true'
          LIVE_SIGNAL_MINUTES: '10'
          LIVE_SIGNAL_MAX_AGE_MS: '840000'
          LIVE_MAX_BANKROLL_USDT: '10.00'
          LIVE_ENTRY_STRATEGY: 'NEAREST_VOLUME'
        run: python blofin_live_signal_watch.py

      - name: Save signal and LIVE state
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Read-only diagnostics run AFTER LIVE execution, never before placing orders.
          # A diagnostics/API failure must never block saving LIVE state.
          if [ -f blofin_live_state.json ]; then
            LIVE_SIGNAL_MINUTES=10 python blofin_live_scan_audit.py || echo 'AUDIT_ERROR: scan diagnostics failed; preserving LIVE state'
            if [ -f blofin_live_scans/live_watch_history_10m.json ]; then
              git add -- blofin_live_scans/live_watch_history_10m.json
            fi
          fi
          git add blofin_signal_state.json
          if [ -f blofin_pending_signal.json ]; then
            git add blofin_pending_signal.json
          fi
          if [ -f blofin_live_state.json ]; then
            git add blofin_live_state.json
          fi
          if [ -f blofin_live_technical_events.json ]; then
            git add blofin_live_technical_events.json
          fi
          if [ -f blofin_learning_12h.json ]; then
            git add blofin_learning_12h.json
          fi
          if [ -f blofin_pattern_learning.json ]; then
            git add blofin_pattern_learning.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update BloFin signal state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Notify LIVE scanner failure
        if: failure()
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 \
            -H 'Title: BloFin LIVE scanner ERROR' \
            -H 'Priority: 5' \
            -d "LIVE scanner failed. Sprawdz GitHub Actions run ${GITHUB_RUN_ID}." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
