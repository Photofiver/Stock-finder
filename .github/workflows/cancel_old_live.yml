name: Cancel old LIVE runner

on:
  push:
    paths:
      - '.github/workflows/cancel_old_live.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel old continuous LIVE run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '36972355231'
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
