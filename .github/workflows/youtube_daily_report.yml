name: BloFin daily YouTube report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/youtube_daily_report.yml', 'youtube_daily_render.py', 'youtube_daily_upload.py']
  schedule:
    # Prepare well before 06:00 London, including during British Summer Time.
    - cron: '17 3,4,5,6 * * *'
    - cron: '43 3,4,5 * * *'
  workflow_run:
    workflows: ['BloFin LIVE signal watch']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blofin-youtube-daily
  cancel-in-progress: false
jobs:
  report:
    if: >-
      vars.YOUTUBE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (contains(github.event.workflow_run.created_at, 'T03:0') ||
         contains(github.event.workflow_run.created_at, 'T03:3') ||
         contains(github.event.workflow_run.created_at, 'T04:0') ||
         contains(github.event.workflow_run.created_at, 'T04:3') ||
         contains(github.event.workflow_run.created_at, 'T05:0') ||
         contains(github.event.workflow_run.created_at, 'T05:3') ||
         contains(github.event.workflow_run.created_at, 'T06:0') ||
         contains(github.event.workflow_run.created_at, 'T06:3'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Story-replay episodes use a date marker to avoid duplicate daily uploads.
    steps:
      - name: Read source and current state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for file in youtube_daily_render.py youtube_daily_upload.py; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA" > "$file"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/blofin_live_state.json?ref=main" > blofin_live_state.json
          python3 -m py_compile youtube_daily_render.py youtube_daily_upload.py
      - name: Set up Python and check today's publication
        id: preflight
        env:
          YOUTUBE_ENABLED: ${{ vars.YOUTUBE_ENABLED }}
          YOUTUBE_CHANNEL_ID: UCzcQGgJtUl7LWv0ktffMnFg
          YOUTUBE_PRIVACY: public
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/youtube-check
          /tmp/youtube-check/bin/pip install google-api-python-client google-auth
          /tmp/youtube-check/bin/python youtube_daily_upload.py --check-existing | tee /tmp/youtube-check.log
          grep '^REPORT_EXISTS=' /tmp/youtube-check.log | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      - name: Render MP4 without publishing
        if: steps.preflight.outputs.report_exists == 'false' || github.event_name == 'push'
        run: |
          set -eu
          if ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          fi
          python3 -m venv /tmp/bootstrap
          /tmp/bootstrap/bin/pip install uv
          /tmp/bootstrap/bin/uv venv --python 3.12 /tmp/youtube-video
          /tmp/bootstrap/bin/uv pip install --python /tmp/youtube-video/bin/python pillow num2words kokoro-onnx soundfile imageio-ffmpeg google-api-python-client google-auth
          curl -fL --retry 2 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 2 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          /tmp/youtube-video/bin/python youtube_daily_render.py
      - name: Verify rendered file without storing artifacts
        if: steps.preflight.outputs.report_exists == 'false' || github.event_name == 'push'
        run: |
          test -s youtube_output/report.mp4
          FF=$(/tmp/youtube-video/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FF" -v error -i youtube_output/report.mp4 -f null -
          echo 'MP4 decoding passed'
      - name: Upload to authorized YouTube channel
        if: github.ref == 'refs/heads/main' && steps.preflight.outputs.report_exists == 'false' && vars.YOUTUBE_ENABLED == 'true'
        env:
          YOUTUBE_ENABLED: ${{ vars.YOUTUBE_ENABLED }}
          YOUTUBE_CHANNEL_ID: UCzcQGgJtUl7LWv0ktffMnFg
          YOUTUBE_PRIVACY: public
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: /tmp/youtube-video/bin/python youtube_daily_upload.py
