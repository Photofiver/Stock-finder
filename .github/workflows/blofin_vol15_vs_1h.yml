name: BloFin 15m vs 1h volume test
on:
  push:
    paths:
      - 'vol15_vs_1h_trigger.txt'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_vol15_vs_1h.py
