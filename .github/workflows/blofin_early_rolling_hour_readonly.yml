name: EARLY rolling last hour 390 coins (READ ONLY)
on:
  push:
    paths:
      - 'blofin_early_rolling_hour_readonly.py'
      - '.github/workflows/blofin_early_rolling_hour_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candles:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Read public BloFin market candles without LIVE changes
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_early_rolling_hour_readonly.py fetch ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: early-hour-shard-${{ matrix.shard }}
          path: early_hour_${{ matrix.shard }}.json.gz
          retention-days: 5
  evaluate:
    needs: candles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          pattern: early-hour-shard-*
          merge-multiple: true
          path: shards
      - name: Combine the 390 symbols and count EARLY signals
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_early_rolling_hour_readonly.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-rolling-hour-20261018
          path: blofin_early_rolling_hour_report.json
          retention-days: 7
          if-no-files-found: ignore
