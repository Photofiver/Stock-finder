name: BloFin volume multiplier optimizer
on:
  push:
    paths:
      - 'volmult_trigger.txt'
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_volmult_optimizer.py
