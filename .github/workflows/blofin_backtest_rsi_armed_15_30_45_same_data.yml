name: BloFin RSI Armed 15 30 45 Same Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_backtest_rsi_armed_15_30_45_same_data.py'
      - '.github/workflows/blofin_backtest_rsi_armed_15_30_45_same_data.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_rsi_armed_15_30_45_same_data.py
