name: Discover unique winner traits vs losers (READ ONLY)
on:
  push:
    paths:
      - 'short37_find_discriminating_patterns_readonly.py'
      - '.github/workflows/short37_find_discriminating_patterns.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            short37_find_discriminating_patterns_readonly.py
            short60_subset_3to4x_winloss_explanation.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Explore pre-entry conditions and verify on other signals
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u short37_find_discriminating_patterns_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unique-short-winner-patterns-analysis
          path: short37_discriminating_volume_price_patterns_20261018.json
          retention-days: 7
          if-no-files-found: ignore
