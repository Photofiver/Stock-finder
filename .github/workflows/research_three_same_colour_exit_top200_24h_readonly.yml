name: Test EXIT after 3 colour bars vs volume 24h READ ONLY
on:
  push:
    paths:
      - 'research_three_same_colour_exit_top200_24h_readonly.py'
      - '.github/workflows/research_three_same_colour_exit_top200_24h_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research_three_same_colour_exit_top200_24h_readonly.py
            research_volume_bar_counts_top200_20261018_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Analyze same entry signals and 4-slot capital-limited portfolios
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_three_same_colour_exit_top200_24h_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-3-colour-bars-backtest-24h
          path: volume_exit_after_three_same_colour_24h.json
          retention-days: 14
          if-no-files-found: ignore
