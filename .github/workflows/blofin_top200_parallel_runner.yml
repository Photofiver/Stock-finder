name: TOP200 Repeating Setup Parallel Backtest (READ ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_top200_parallel_runner.py'
      - '.github/workflows/blofin_top200_parallel_runner.yml'

permissions:
  contents: read

jobs:
  historical_candles:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout root read-only strategy files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTTP dependency
        run: python -m pip install requests==2.32.3
      - name: Validate source
        run: python -m py_compile blofin_top200_parallel_runner.py blofin_top200_repeat_setup_research.py
      - name: Download only assigned quarter of eligible exchange candles
        env:
          RESEARCH_ASOF_UK: '2026-10-17'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_parallel_runner.py fetch ${{ matrix.shard }}
      - name: Upload market candles shard for analysis
        uses: actions/upload-artifact@v4
        with:
          name: top200-candle-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json.gz
          if-no-files-found: error
          retention-days: 2

  analyze:
    needs: historical_candles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout strategy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests==2.32.3
      - name: Download all four market-data batches
        uses: actions/download-artifact@v4
        with:
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Verify strategy and offline point-in-time ranking
        env:
          RESEARCH_ASOF_UK: '2026-10-17'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_parallel_runner.py analyze
      - name: Upload final daily research numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top200-repeated-volume-pattern-results
          path: blofin_top200_repeat_setup_report.json
          if-no-files-found: ignore
          retention-days: 14
