name: BloFin 1H Only MACD Median3 Backtest

on:
  push:
    paths:
      - 'blofin_backtest_1h_only_macd_med3.py'
      - '.github/workflows/blofin_backtest_1h_only_macd_med3.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_1h_only_macd_med3.py
