name: Volume bars until larger opposite 24h TOP200 READ ONLY
on:
  push:
    paths:
      - 'research_volume_bar_counts_top200_20261018_readonly.py'
      - '.github/workflows/research_volume_bar_counts_top200_20261018_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research_volume_bar_counts_top200_20261018_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Count colour volumes with point-in-time TOP200 rank, 5m and MA20 entry
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_volume_bar_counts_top200_20261018_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top200-24h-opposite-volume-counts
          path: volume_colour_to_larger_opposite_top200_24h_result.json
          retention-days: 14
          if-no-files-found: ignore
