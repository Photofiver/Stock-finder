name: Test found DI plus below 20 on selected 37 vs 26 READ ONLY
on:
  push:
    paths:
      - 'research_plus_di_under20_check_chosen37_26_readonly.py'
      - '.github/workflows/research_plus_di_under20_check_chosen37_26_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research_plus_di_under20_check_chosen37_26_readonly.py
            short37_extra_indicators_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Validate preset DI plus threshold without touching live
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_plus_di_under20_check_chosen37_26_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosen-37-26-di-plus-under20-check
          path: short_3w7l_di20_check_on_chosen37_26_readonly_report.json
          retention-days: 14
          if-no-files-found: ignore
