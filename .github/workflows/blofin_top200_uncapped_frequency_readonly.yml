name: TOP200 Uncapped Setup Frequency READ ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_top200_uncapped_frequency_readonly.py'
      - '.github/workflows/blofin_top200_uncapped_frequency_readonly.yml'
permissions:
  contents: read
  actions: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests==2.32.3
      - name: Reuse previously fetched 390-market dataset
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Calculate 8 days exact daily frequency (unchanged frozen rules)
        env:
          RESEARCH_ASOF_UK: '2026-10-17'
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_top200_uncapped_frequency_readonly.py
      - name: Archive uncapped signal and entry frequency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top200-uncapped-frequency
          path: blofin_top200_uncapped_frequency_report.json
          retention-days: 14
          if-no-files-found: ignore
