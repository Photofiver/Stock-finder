name: READONLY JSON tunnel historical BloFin candle replay
on:
  push:
    paths:
      - 'research_volume_price_tunnel_from_blofin_readonly.py'
      - '.github/workflows/research_volume_price_tunnel_from_blofin_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research_volume_price_tunnel_from_blofin_readonly.py
            blofin_volume_flip_both_live.py
            blofin_live_state.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Test 60 archived actual JSON trade entries with public historical confirmed BloFin candles
        env:
          BLOFIN_LIVE_ENABLED: 'false'
          LIVE_VOLUME_FLIP_BOTH_PAUSE_ENTRIES: 'true'
        run: python -u research_volume_price_tunnel_from_blofin_readonly.py
