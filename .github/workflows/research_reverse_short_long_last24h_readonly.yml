name: Reverse LONG exact last 24h historical replay READ ONLY
on:
  push:
    paths:
      - 'research_reverse_short_long_last24h_readonly.py'
      - '.github/workflows/research_reverse_short_long_last24h_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research_reverse_short_long_last24h_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
            blofin_reverse_short_long_live.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Reconstruct TOP200 every 5m and replay entry and exit over last24h
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_reverse_short_long_last24h_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-long-last24h-exact-signal-report
          path: reverse_short_long_last24h_readonly_result.json
          retention-days: 14
          if-no-files-found: ignore
