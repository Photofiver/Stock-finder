name: BloFin volume flip only test
on:
  push:
    paths:
      - 'volume_flip_only_trigger.txt'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_volume_flip_only.py
