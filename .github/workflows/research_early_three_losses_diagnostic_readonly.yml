name: EARLY three losses entry candle diagnostic READ ONLY

on:
  push:
    paths:
      - 'research_early_three_losses_diagnostic_readonly.py'
      - '.github/workflows/research_early_three_losses_diagnostic_readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Download already verified BloFin 390-coin 5m candles
        uses: actions/download-artifact@v4
        with:
          run-id: 39080889854
          github-token: ${{ github.token }}
          pattern: early-hour-shard-*
          merge-multiple: true
          path: shards
      - name: Diagnose exactly three stopped out EARLY positions
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_early_three_losses_diagnostic_readonly.py
