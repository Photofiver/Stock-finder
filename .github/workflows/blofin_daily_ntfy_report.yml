name: BloFin LIVE daily report to ntfy

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blofin_daily_ntfy_report.yml'
      - 'blofin_daily_ntfy_report.py'
  workflow_run:
    workflows: ['BloFin LIVE signal watch']
    types: [completed]
  schedule:
    # Independent fallback; late runs catch up after 06:00 UK.
    - cron: '0 5,6 * * *'
    - cron: '3,23,43 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: blofin-live-daily-ntfy-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check due time and confirmed ntfy delivery
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/London date +%F)
          echo "day=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Sending recovery report after configuration update."
            echo 'send=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ=Europe/London date +%H)
          if [ "$((10#$HOUR))" -lt 6 ]; then
            echo "Before 06:00 UK; report not due."
            echo 'send=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only a persisted ntfy receipt counts as sent, never a skipped run.
          # All triggers share concurrency, so receipts are checked serially.
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=blofin-daily-ntfy-sent-${TODAY}&per_page=100"
          RECEIPTS=$(curl --fail-with-body --show-error --silent --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$URL")
          ALREADY=$(printf '%s' "$RECEIPTS" | jq -er --arg name "blofin-daily-ntfy-sent-${TODAY}" \
            'if (.artifacts | type) != "array" then error("Invalid artifact response") else ([.artifacts[] | select(.name == $name and .expired == false)] | length > 0 | tostring) end')
          if [ "$ALREADY" = 'true' ]; then
            echo "Confirmed report receipt exists for today."
            echo 'send=false' >> "$GITHUB_OUTPUT"
          else
            echo 'send=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout current bot state, without modifying trading
        if: steps.guard.outputs.send == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            blofin_live_state.json
            blofin_daily_ntfy_report.py
          sparse-checkout-cone-mode: false

      - name: Refresh latest bot state
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          test -s blofin_live_state.json
          test -s blofin_daily_ntfy_report.py

      - name: Build read-only empirical report
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 blofin_daily_ntfy_report.py | tee /tmp/blofin_daily_ntfy_message.txt
          test -s /tmp/blofin_daily_ntfy_message.txt

      - name: Send report through existing ntfy topic
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 30 \
            --output /tmp/blofin_daily_ntfy_receipt.json \
            -H 'Title: BloFin LIVE - 120000 USDT' \
            -H 'Priority: 4' \
            -H 'Tags: chart_with_upwards_trend' \
            --data-binary @/tmp/blofin_daily_ntfy_message.txt \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n'
          jq -e '.event == "message" and (.id | type == "string") and (.id | length > 0)' /tmp/blofin_daily_ntfy_receipt.json
          echo 'NTFY_REPORT_ACCEPTED_BY_SERVER'

      - name: Persist confirmed daily delivery
        if: steps.guard.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blofin-daily-ntfy-sent-${{ steps.guard.outputs.day }}
          path: /tmp/blofin_daily_ntfy_receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Notify if report generation failed
        if: failure() && steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          curl --fail-with-body --show-error --silent --retry 2 --max-time 20 \
            -H 'Title: BloFin DAILY REPORT ERROR' -H 'Priority: 5' \
            -d "GitHub daily ntfy report failed; run $GITHUB_RUN_ID." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
