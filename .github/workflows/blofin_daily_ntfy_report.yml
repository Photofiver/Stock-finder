name: BloFin LIVE daily report to ntfy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blofin_daily_ntfy_report.yml'
      - 'blofin_daily_ntfy_report.py'
  schedule:
    # Main send at 07:00 UK; backup at 07:10 UK. UTC hours cover GMT/BST.
    - cron: '0,10 6,7 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: blofin-live-daily-ntfy-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check 07:00 UK and avoid duplicate scheduled reports
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Testing updated workflow after push."
            echo 'send=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=Europe/London date +%H)" != "07" ]; then
            echo "Not UK 07:00-07:59; skipping UTC daylight saving duplicate."
            echo 'send=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Serialized by workflow concurrency; check previously successful runs
          # so the 07:10 backup does not send a second notification.
          TODAY=$(TZ=Europe/London date +%F)
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/blofin_daily_ntfy_report.yml/runs?per_page=30"
          if RUNS=$(curl --fail-with-body --show-error --silent --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$URL"); then
            ALREADY=$(printf '%s' "$RUNS" | jq -r --arg day "$TODAY" --argjson current "$GITHUB_RUN_ID" \
              '[.workflow_runs[]? | select(.id != $current and .conclusion == "success" and (.event == "schedule" or .event == "workflow_dispatch") and .created_at >= ($day + "T05:00:00Z"))] | length > 0')
            if [ "$ALREADY" = 'true' ]; then
              echo "Report already sent today; suppressing duplicate."
              echo 'send=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Cannot verify previous send; trying report to avoid missing it."
          fi

          echo 'send=true' >> "$GITHUB_OUTPUT"

      - name: Checkout current bot state, without modifying trading
        if: steps.guard.outputs.send == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            blofin_live_state.json
            blofin_daily_ntfy_report.py
          sparse-checkout-cone-mode: false

      - name: Refresh latest bot state
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          test -s blofin_live_state.json
          test -s blofin_daily_ntfy_report.py

      - name: Build read-only empirical report
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 blofin_daily_ntfy_report.py | tee /tmp/blofin_daily_ntfy_message.txt
          test -s /tmp/blofin_daily_ntfy_message.txt

      - name: Send report through existing ntfy topic
        if: steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 30 \
            -H 'Title: BloFin LIVE - 120000 USDT' \
            -H 'Priority: 4' \
            -H 'Tags: chart_with_upwards_trend' \
            --data-binary @/tmp/blofin_daily_ntfy_message.txt \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n'
          echo 'NTFY_REPORT_ACCEPTED_BY_SERVER'

      - name: Notify if report generation failed
        if: failure() && steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          curl --fail-with-body --show-error --silent --retry 2 --max-time 20 \
            -H 'Title: BloFin DAILY REPORT ERROR' -H 'Priority: 5' \
            -d "GitHub daily ntfy report failed; run $GITHUB_RUN_ID." \
            'https://ntfy.sh/blofin-nhd0jt7wspfnhtitdlaowk1n' || true
