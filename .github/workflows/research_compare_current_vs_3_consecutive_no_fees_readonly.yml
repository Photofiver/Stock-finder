name: NO FEE 3 consecutive bars vs current exit READ ONLY
on:
  push:
    paths:
      - 'research_compare_current_vs_3_consecutive_no_fees_readonly.py'
      - '.github/workflows/research_compare_current_vs_3_consecutive_no_fees_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research_compare_current_vs_3_consecutive_no_fees_readonly.py
            research_three_same_colour_exit_top200_24h_readonly.py
            research_three_same_colour_exit_top200_8d_readonly.py
            research_volume_bar_counts_top200_20261018_readonly.py
            research_compare_flip24_early_same_top200_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Read frozen public OHLCV history (24h)
        uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Read frozen public OHLCV history (8d)
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Backtest no fee comparison, 1x, capital 25 USDT, max 4
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_compare_current_vs_3_consecutive_no_fees_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-fees-current-versus-3-consecutive-24h-and-8d
          path: no_fees_current_vs_3_consecutive_24h_8d.json
          retention-days: 14
          if-no-files-found: ignore
