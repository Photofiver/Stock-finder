name: Strategy watch 5m

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'strategy_watch_5m.py'
      - '.github/workflows/strategy-watch-5m.yml'

permissions:
  contents: write

concurrency:
  group: strategy-watch-5m
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for exact candidates
        run: python strategy_watch_5m.py

      - name: Commit watcher state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strategy_watch_candidates.json strategy_watch_history.jsonl strategy_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'strategy watch: save scan'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
