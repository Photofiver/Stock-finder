name: BloFin selection safety tests

on:
  workflow_dispatch:
  push:
    paths:
      - blofin_selection_rank.py
      - blofin_live_hourly.py
      - blofin_live_scan_audit.py
      - test_blofin_selection_rank.py
      - .github/workflows/blofin_selection_safety_check.yml

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile blofin_live_hourly.py blofin_live_signal_watch.py blofin_live_scan_audit.py blofin_selection_rank.py
      - name: Run offline trade-selection tests
        run: python -m unittest -q test_blofin_selection_rank
