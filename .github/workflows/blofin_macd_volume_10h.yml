name: BloFin MACD plus volume 10h
on:
  push:
    paths:
      - 'macdvol_trigger.txt'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_macd_volume_10h.py
