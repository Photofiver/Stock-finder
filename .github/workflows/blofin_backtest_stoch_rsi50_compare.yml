name: BloFin Stoch RSI50 Compare

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_backtest_stoch_rsi50_compare.py'
      - '.github/workflows/blofin_backtest_stoch_rsi50_compare.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_stoch_rsi50_compare.py
