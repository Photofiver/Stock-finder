name: ACTUAL BloFin last-hour 3same4opposite comparison READ ONLY
on:
  push:
    paths:
      - 'research_actual_last_hour_3same4opposite_20261019_readonly.py'
      - '.github/workflows/research_actual_last_hour_3same4opposite_20261019_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research_actual_last_hour_3same4opposite_20261019_readonly.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Fetch only 4 PUBLIC BloFin 5m candle sequences; compare to recorded actual fills
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_actual_last_hour_3same4opposite_20261019_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-hour-vs-3same4opposite-with-each-confirmed-candle
          path: actual_last_hour_vs_3same4opposite_readonly.json
          retention-days: 14
          if-no-files-found: ignore
