name: Top10 hour coin profit loss comparison READ ONLY
on:
  push:
    paths:
      - 'research_short_top10_1835_1935_price_moves_readonly.py'
      - '.github/workflows/research_short_top10_1835_1935_price_moves_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research_short_top10_1835_1935_price_moves_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Compare actual 18 35 to 19 35 price change for fixed 10 coins
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_short_top10_1835_1935_price_moves_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-last-hour-top10-price-moves
          path: short_top10_1835_1935_prices_only.json
          retention-days: 7
          if-no-files-found: ignore
