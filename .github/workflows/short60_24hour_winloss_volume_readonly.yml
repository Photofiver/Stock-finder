name: SHORT 24h winner vs loser volume (READ ONLY)
on:
  push:
    paths:
      - 'short60_24hour_winloss_volume_readonly.py'
      - '.github/workflows/short60_24hour_winloss_volume_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            short60_24hour_winloss_volume_readonly.py
            short60_volume_mean10_24hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 39148408029
          github-token: ${{ github.token }}
          pattern: short60-24h-market-shard-*
          merge-multiple: true
          path: shards
      - name: Compare winning versus losing SHORT signal volumes using complete archived data
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u short60_24hour_winloss_volume_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short60-24hour-wins-losses-volume
          path: short60_24hour_wins_losses_volume_report.json
          retention-days: 7
          if-no-files-found: ignore
