name: BloFin All Same Data Compare

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_backtest_all_same_data.py'
      - '.github/workflows/blofin_backtest_all_same_data.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_all_same_data.py
