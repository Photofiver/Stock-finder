name: Verify ONE volume entry
on:
  push:
    paths:
      - 'verify_one_trigger.txt'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python verify_one_volume.py
