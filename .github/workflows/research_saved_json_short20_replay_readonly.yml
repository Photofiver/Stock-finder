name: Replay selected SHORT strategy from saved JSON ONLY (READ ONLY)
on:
  push:
    paths:
      - 'research_saved_json_short20_replay_readonly.py'
      - '.github/workflows/research_saved_json_short20_replay_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            research_saved_json_short20_replay_readonly.py
            blofin_live_scans/live_watch_history_5m*.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct 5m OHLCV from saved JSON next-candle reviews
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_saved_json_short20_replay_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-short-20-0-rule-on-saved-json
          path: research_saved_json_short20_replay_results.json
          retention-days: 7
          if-no-files-found: ignore
