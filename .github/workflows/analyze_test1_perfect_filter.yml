name: Analyze TEST 1 zero-loss filter

on:
  push:
    paths:
      - 'test1_perfect_filter_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Temporary Elliott Oct 1-2 analysis
        run: python tmp_elliott_oct12.py
      - name: Save temporary Elliott result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_elliott_oct12_result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save temporary Elliott Oct 1-2 analysis'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
