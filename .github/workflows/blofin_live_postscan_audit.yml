name: BloFin LIVE post-scan audit (separate from LIVE runner)

# Run the heavy archive and historical audit on a separate 15-minute schedule.
# This concurrency group is independent from LIVE trading every 5 minutes.
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    paths:
      - '.github/workflows/blofin_live_postscan_audit.yml'

permissions:
  contents: write

concurrency:
  group: blofin-postscan-audit-only
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /blofin_live_scans/
            /blofin_trade_charts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Slow historical scan audit and context cache OFF the LIVE critical path
        env:
          BLOFIN_LIVE_ENABLED: 'false'
          LIVE_SIGNAL_MINUTES: '5'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # No LIVE credentials and no order submission. Historical archives
          # may take several minutes to checkout; ALWAYS reload the newest
          # remote trading state before producing an audit commit.
          for attempt in 1 2 3; do
            git fetch origin main --depth=1
            git reset --hard origin/main
            python blofin_live_scan_audit.py || echo 'AUDIT_WARN: retrospective audit failed'
            for f in blofin_live_scans/live_watch_history_5m_part*.json; do
              if [ -f "$f" ]; then git add -- "$f"; fi
            done
            python bot_context_builder.py || echo 'AUDIT_WARN: bot context cache build failed'
            if [ -f bot_context.json ]; then git add -- bot_context.json; fi
            if git diff --cached --quiet; then
              echo 'POSTSCAN_AUDIT_NO_CHANGES'
              exit 0
            fi
            git commit -m 'Update BloFin asynchronous audit and context'
            if git push origin HEAD:main; then
              echo 'POSTSCAN_AUDIT_SAVED'
              exit 0
            fi
            # A concurrent LIVE scan pushed first. Discard the stale audit
            # commit and RECOMPUTE against newer data; never rebase JSON merges.
            echo "POSTSCAN_AUDIT_REMOTE_CHANGED_RECOMPUTING $attempt/3"
            sleep 2
          done
          echo 'POSTSCAN_AUDIT_SAVE_FAILED: LIVE runner unaffected'
          exit 1
