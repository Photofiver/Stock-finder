name: EARLY latest hour pattern (READ ONLY)

on:
  push:
    paths:
      - 'research_early_recent_hour_readonly.py'
      - '.github/workflows/research_early_recent_hour_readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Verify read-only syntax
        run: python -m py_compile research_early_recent_hour_readonly.py
      - name: Fetch public 5m histories
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_early_recent_hour_readonly.py fetch ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: early-candle-shard-${{ matrix.shard }}
          path: early_shard_${{ matrix.shard }}.json.gz
          retention-days: 2

  evaluate:
    needs: candles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          pattern: early-candle-shard-*
          merge-multiple: true
          path: shards
      - name: Count signals in exact last hour independent of trading-time filter
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_early_recent_hour_readonly.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-last-hour-signal-result
          path: blofin_early_last_hour_20261018.json
          retention-days: 7
          if-no-files-found: ignore
