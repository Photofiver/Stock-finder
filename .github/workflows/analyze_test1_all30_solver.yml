name: Solve TEST 1 all 30 profitable

on:
  push:
    paths:
      - 'test1_all30_solver_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Solve all 30
        run: python analyze_test1_all30_solver.py
      - name: Save result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test1_all30_solver_result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save TEST 1 all30 solver result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
