name: BloFin validate last 3 checks

on:
  push:
    paths:
      - 'blofin_validate_last3.py'
      - '.github/workflows/blofin_validate_last3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Recompute the 30 historical observations from BloFin public candles
        run: python blofin_validate_last3.py

      - name: Save validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blofin_last3_validation.json
          git commit -m 'Save BloFin last3 validation report'
          git pull --rebase origin main
          git push origin HEAD:main
