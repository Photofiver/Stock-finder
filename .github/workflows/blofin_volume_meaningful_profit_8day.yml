name: Search meaningful volume trend profits 8 days (READ ONLY)

on:
  workflow_dispatch:
  push:
    paths:
      - 'blofin_volume_meaningful_profit_8day.py'
      - '.github/workflows/blofin_volume_meaningful_profit_8day.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read-only sparse checkout of root scripts and state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public candles dependency
        run: python -m pip install requests==2.32.3
      - name: Verify syntax
        run: python -m py_compile blofin_volume_meaningful_profit_8day.py blofin_volume_peak_trend_backtest_readonly.py blofin_trendline_backtest_readonly.py
      - name: Simulate volume strategy variants using public closed candles
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u blofin_volume_meaningful_profit_8day.py
      - name: Upload immutable research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meaningful-volume-profit-8day
          path: volume_meaningful_profit_8day_report.json
          retention-days: 7
          if-no-files-found: ignore
