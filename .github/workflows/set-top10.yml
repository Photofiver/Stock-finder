name: Set BloFin TOP 10

on:
  push:
    paths:
      - 'set_top10.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change scanner to TOP 10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('blofin_scanner.py')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace('TOP_N = 25', 'TOP_N = 10')
          text = text.replace('TOP 25 podczas analizy', 'TOP 10 podczas analizy')
          if text == old:
              raise SystemExit('Expected TOP 25 settings not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blofin_scanner.py
          git commit -m "Use TOP 10 for BloFin 1H scanner"
          git push
