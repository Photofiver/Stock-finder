name: SHORT TOP10 last hour historical check READ ONLY
on:
  push:
    paths:
      - 'research_short_top10_last_hour_readonly.py'
      - '.github/workflows/research_short_top10_last_hour_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research_short_top10_last_hour_readonly.py
            blofin_top200_repeat_setup_research.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Read public BloFin top10 and 5m last hour, no trading
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_short_top10_last_hour_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-top10-last-hour-readonly-results
          path: short_top10_last_hour_readonly_report.json
          retention-days: 7
          if-no-files-found: ignore
