name: BloFin dashboard snapshot (read-only)
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blofin_dashboard_snapshot.yml'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: blofin-dashboard-snapshot-only
  cancel-in-progress: false

jobs:
  dashboard_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout LIVE state, read only
        uses: actions/checkout@v4
        with:
          ref: main
          path: state
          fetch-depth: 1
          sparse-checkout: |
            blofin_live_state.json
          sparse-checkout-cone-mode: false

      - name: Checkout separate dashboard branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dashboard
          fetch-depth: 1

      - name: Create compact dashboard data
        shell: bash
        run: |
          set -euo pipefail
          python3 dashboard/rsi_dashboard_snapshot.py --state state/blofin_live_state.json --out dashboard/live_dashboard.json

      - name: Publish dashboard JSON only (no bot code changes)
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
            exit 0
          fi
          git commit -m "Update read-only BloFin dashboard data [skip ci]"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
