name: BloFin RSI history (read-only dashboard)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '.github/workflows/blofin_rsi_history_readonly.yml'

permissions:
  contents: write

concurrency:
  group: blofin-rsi-history-dashboard-only
  cancel-in-progress: false

jobs:
  rsi_history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest LIVE state (read only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: state
          fetch-depth: 1
          sparse-checkout: |
            blofin_live_state.json
          sparse-checkout-cone-mode: false

      - name: Checkout independent dashboard
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dashboard
          fetch-depth: 0

      - name: Reconstruct confirmed 5m RSI from public BloFin candles
        shell: bash
        run: |
          set -euo pipefail
          python3 dashboard/rsi_rebuild.py --state state/blofin_live_state.json --out dashboard/rsi_audit.json

      - name: Publish only RSI audit JSON (never modify bot state)
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rsi_audit.json
          if git diff --cached --quiet; then
            echo "No newly verified RSI values; no publication needed."
            exit 0
          fi
          git commit -m "Update read-only historical 5m RSI audit [skip ci]"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
