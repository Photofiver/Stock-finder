name: Backtest random hour frozen tree

on:
  push:
    paths:
      - 'random_hour_tree_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run random-hour backtest
        run: python backtest_random_hour_tree.py
      - name: Save result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add random_hour_tree_backtest_result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save random-hour frozen-tree backtest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
