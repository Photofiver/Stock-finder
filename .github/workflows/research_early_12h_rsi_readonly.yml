name: EARLY last 12h RSI filter audit READ ONLY

on:
  push:
    paths:
      - 'research_early_12h_rsi_readonly.py'
      - '.github/workflows/research_early_12h_rsi_readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3
      - name: Reuse previously verified 390 coin market history
        uses: actions/download-artifact@v4
        with:
          run-id: 39080889854
          github-token: ${{ github.token }}
          pattern: early-hour-shard-*
          merge-multiple: true
          path: old_shards
      - name: Use full eight-day 390-coin archive to cover the earliest TOP200 price lookback
        uses: actions/download-artifact@v4
        with:
          run-id: 39074940517
          github-token: ${{ github.token }}
          pattern: top200-candle-shard-*
          merge-multiple: true
          path: historical_shards
      - name: Reuse recently refreshed 390-coin candles (02:55 UK cutoff)
        uses: actions/download-artifact@v4
        with:
          run-id: 39088649866
          github-token: ${{ github.token }}
          pattern: rsi12-refresh-*
          merge-multiple: true
          path: fresh_shards
      - name: Compare chronological EARLY baseline vs RSI 70/30 filters, after costs
        env:
          BLOFIN_LIVE_ENABLED: 'false'
        run: python -u research_early_12h_rsi_readonly.py analyze
      - name: Store full trade-level audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-12hours-rsi-70-30-report
          path: blofin_early_12h_rsi_filter_report.json
          retention-days: 10
          if-no-files-found: ignore
