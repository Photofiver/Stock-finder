name: BloFin TP sensitivity
on:
  push:
    paths:
      - 'tp_sensitivity_trigger.txt'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_tp_sensitivity.py
