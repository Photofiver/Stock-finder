name: BloFin RSI Armed Hold 4 5 6 8 Fixed

on:
  push:
    paths:
      - 'blofin_backtest_rsi_armed_hold_4_5_6_8_fixed.py'
      - '.github/workflows/blofin_backtest_rsi_armed_hold_4_5_6_8_fixed.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python blofin_backtest_rsi_armed_hold_4_5_6_8_fixed.py
