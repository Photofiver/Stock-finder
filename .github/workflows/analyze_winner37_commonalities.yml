name: Compare 37 winner commonalities

on:
  push:
    paths:
      - 'winner37_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python analyze_winner37_commonalities.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add winner37_commonalities_result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save 37 winner commonality analysis'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
