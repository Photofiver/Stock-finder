name: BloFin LIVE close reasons (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blofin_close_reasons.yml'
      - 'blofin_close_reasons_audit.py'
      - 'blofin_close_bulk_backfill.py'
  schedule:
    - cron: '24,54 * * * *' # gentle batch checks, avoid BloFin firewall

permissions:
  contents: write

concurrency:
  group: blofin-close-reasons-bulk-v3
  cancel-in-progress: false

jobs:
  close-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download only two diagnostic scripts (no repository checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, base64, json
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/'
          for filename in ('blofin_close_reasons_audit.py', 'blofin_close_bulk_backfill.py', 'test_blofin_close_bulk_backfill.py'):
              request = urllib.request.Request(root + filename + '?ref=main', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github.raw+json',
                  'User-Agent': 'BloFinCloseAudit/1.0',
              })
              with urllib.request.urlopen(request, timeout=35) as response:
                  contents = response.read()
              if contents.startswith(b'{'):
                  try:
                      payload = json.loads(contents)
                      if payload.get('encoding') == 'base64':
                          contents = base64.b64decode(payload['content'])
                  except (ValueError, KeyError, TypeError):
                      pass
              with open(filename, 'wb') as f:
                  f.write(contents)
              print('Downloaded', filename, len(contents), 'bytes')
          PY

      - name: Verify closing order classification without trading
        run: python3 -m unittest -q test_blofin_close_bulk_backfill.py

      - name: Check and save BloFin closing-order causes (only broker GET)
        env:
          GH_TOKEN: ${{ github.token }}
          BLOFIN_API_KEY: ${{ secrets.BLOFIN_API_KEY }}
          BLOFIN_SECRET_KEY: ${{ secrets.BLOFIN_SECRET_KEY }}
          BLOFIN_PASSPHRASE: ${{ secrets.BLOFIN_PASSPHRASE }}
          NTFY_TOPIC: 'blofin-nhd0jt7wspfnhtitdlaowk1n'
        run: python3 blofin_close_bulk_backfill.py
